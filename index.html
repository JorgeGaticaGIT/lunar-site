<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar — Sistema de Gestão para Lavanderias</title>
<meta name="description" content="O Lunar organiza pedidos, prazos, cobranças e entregas da sua lavanderia em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:        #0B2420;
  --ink-soft:   #2A423D;
  --paper:      #F6F7F3;
  --paper-dim:  #EDEFE9;
  --card:       #FFFFFF;
  --brand:      #0F6E56;
  --brand-deep: #0A4A3B;
  --brand-tint: #E1F5EE;
  --brass:      #B8862E;
  --brass-tint: #F4E9D3;
  --sage:       #DEEAE4;
  --line:       #D7DBD3;
  --line-strong:#B9C0B8;
  --danger:     #A32D2D;

  --display: 'Fraunces', Georgia, serif;
  --body:    'Manrope', -apple-system, sans-serif;
  --mono:    'IBM Plex Mono', 'SFMono-Regular', monospace;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 26px;
  --shadow-soft: 0 1px 2px rgba(11,36,32,.04), 0 12px 32px -12px rgba(11,36,32,.18);
  --shadow-lift: 0 4px 10px rgba(11,36,32,.06), 0 30px 60px -20px rgba(11,36,32,.28);

  --container: 1180px;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
body{
  margin:0;
  font-family:var(--body);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.08;font-weight:600;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:3px;border-radius:4px}

.wrap{max-width:var(--container);margin:0 auto;padding:0 28px}
@media (max-width:640px){ .wrap{padding:0 20px} }

.eyebrow{
  font-family:var(--mono);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--brand-deep);
  display:inline-flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--brass)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--body);font-weight:700;font-size:15px;
  padding:14px 26px;border-radius:100px;border:1.5px solid transparent;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-soft)}
.btn-primary:hover{background:var(--brand-deep);transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink);background:rgba(11,36,32,.03)}
.btn-brass{background:var(--brass);color:#221704}
.btn-brass:hover{background:#a17825;transform:translateY(-2px)}
.btn-on-dark{background:transparent;color:var(--paper);border-color:rgba(246,247,243,.35)}
.btn-on-dark:hover{border-color:var(--paper);background:rgba(246,247,243,.08)}

/* ── perforated divider — the ticket motif ── */
.perf{
  height:1px;
  background-image:radial-gradient(circle, var(--line-strong) 1.6px, transparent 1.6px);
  background-size:14px 1px;
  background-repeat:repeat-x;
  opacity:.9;
}
.punch{
  width:22px;height:22px;border-radius:50%;
  background:var(--paper);
  border:1.5px dashed var(--line-strong);
  flex-shrink:0;
}

/* ============================================================
   NAV
   ============================================================ */
header.site-nav{
  position:sticky;top:0;z-index:100;
  background:rgba(246,247,243,.86);
  backdrop-filter:blur(10px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:78px}
.brand-mark{display:flex;align-items:center;gap:10px}
.brand-badge{
  width:38px;height:38px;border-radius:10px;
  background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:16px;
}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em}
.brand-text span{font-family:var(--mono);font-size:10px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase}

nav.nav-links{display:flex;align-items:center;gap:32px}
nav.nav-links a{
  font-size:14.5px;font-weight:600;color:var(--ink-soft);
  position:relative;padding:4px 0;
}
nav.nav-links a::after{
  content:'';position:absolute;left:0;bottom:-2px;height:2px;width:0%;
  background:var(--brand);transition:width .22s ease;
}
nav.nav-links a:hover{color:var(--ink)}
nav.nav-links a:hover::after{width:100%}

.nav-cta{display:flex;align-items:center;gap:14px}
.nav-cta .btn{padding:11px 22px;font-size:14px}
.menu-toggle{display:none;background:none;border:none;padding:8px}
.menu-toggle span{display:block;width:22px;height:2px;background:var(--ink);margin:5px 0;transition:transform .2s, opacity .2s}
.menu-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-toggle.open span:nth-child(2){opacity:0}
.menu-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

@media (max-width:900px){
  nav.nav-links{
    position:fixed;inset:78px 0 0 0;background:var(--paper);
    flex-direction:column;align-items:flex-start;gap:0;
    padding:12px 20px 24px;
    transform:translateY(-8px);opacity:0;pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    border-top:1px solid var(--line);
  }
  nav.nav-links.open{opacity:1;transform:translateY(0);pointer-events:auto}
  nav.nav-links a{width:100%;padding:16px 4px;border-bottom:1px solid var(--line);font-size:16px}
  .nav-cta .btn-ghost{display:none}
  .menu-toggle{display:block}
}

/* ============================================================
   HERO
   ============================================================ */
.hero{position:relative;overflow:hidden;padding:84px 0 60px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
@media (max-width:980px){ .hero-grid{grid-template-columns:1fr;gap:56px} }

.hero-copy h1{
  font-size:clamp(34px, 4.6vw, 58px);
  margin:18px 0 22px;
  color:var(--ink);
}
.hero-copy h1 em{font-style:italic;color:var(--brand)}
.hero-copy p.lead{
  font-size:17.5px;color:var(--ink-soft);max-width:520px;margin-bottom:34px;
}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px}
.hero-note{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.hero-note .dots{display:flex;gap:-4px}
.hero-avatars{display:flex}
.hero-avatars span{
  width:28px;height:28px;border-radius:50%;background:var(--sage);
  border:2px solid var(--paper);margin-left:-8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--brand-deep);font-weight:600;
}
.hero-avatars span:first-child{margin-left:0}

/* ── ticket fan (signature element) ── */
.ticket-stage{position:relative;height:440px}
.ticket{
  position:absolute;width:280px;
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--line);
  box-shadow:var(--shadow-lift);
  padding:20px 20px 18px;
  transition:transform .45s cubic-bezier(.16,1,.3,1);
}
.ticket::before{
  content:'';position:absolute;left:0;right:0;top:60px;height:1px;
  background-image:radial-gradient(circle, var(--line-strong) 1.4px, transparent 1.4px);
  background-size:11px 1px;background-repeat:repeat-x;
}
.ticket .t-num{font-family:var(--mono);font-size:11px;color:var(--brand-deep);font-weight:600;letter-spacing:.04em}
.ticket .t-cliente{font-family:var(--display);font-size:19px;font-weight:600;margin:10px 0 2px}
.ticket .t-servico{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.ticket .t-status{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;
  padding:5px 11px;border-radius:100px;display:inline-block;
}
.st-recebido{background:#E6F1FB;color:#185FA5}
.st-lavando{background:#EEEDFE;color:#3C3489}
.st-pronto{background:#EAF3DE;color:#3B6D11}
.st-entregue{background:var(--brand-tint);color:var(--brand-deep)}

.ticket-1{top:0;left:6%;transform:rotate(-9deg);z-index:1}
.ticket-2{top:30px;left:32%;transform:rotate(4deg);z-index:2}
.ticket-3{top:6px;left:56%;transform:rotate(-3deg);z-index:3}
.ticket-4{top:56px;left:14%;transform:rotate(12deg);z-index:0;opacity:.85}
.hero-glow{
  position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle, rgba(15,110,86,.14), transparent 70%);
  top:-120px;right:-160px;z-index:-1;pointer-events:none;
}
@media (max-width:980px){
  .ticket-stage{height:360px;max-width:420px;margin:0 auto}
  .ticket{width:230px;padding:16px 16px 14px}
}
@media (max-width:480px){
  .ticket-stage{height:320px}
  .ticket{width:200px}
  .ticket-4{display:none}
}

/* ============================================================
   STATS — ticket-stub strip
   ============================================================ */
.stats-section{padding:52px 0}
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--line);border-radius:var(--radius-md);
  overflow:hidden;background:var(--card);box-shadow:var(--shadow-soft);
}
.stat-stub{
  padding:26px 24px;border-right:1px dashed var(--line-strong);
  position:relative;
}
.stat-stub:last-child{border-right:none}
.stat-stub .s-num{font-family:var(--mono);font-size:11px;color:var(--brass);font-weight:600;letter-spacing:.08em;margin-bottom:10px;display:block}
.stat-stub .s-val{font-family:var(--display);font-size:32px;font-weight:600;color:var(--ink)}
.stat-stub .s-label{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
@media (max-width:760px){
  .stats-row{grid-template-columns:1fr 1fr}
  .stat-stub:nth-child(2){border-right:none}
  .stat-stub:nth-child(1),.stat-stub:nth-child(2){border-bottom:1px dashed var(--line-strong)}
}

/* ============================================================
   SECTION HEADERS
   ============================================================ */
.section{padding:96px 0}
.section-alt{background:var(--sage)}
.section-head{max-width:640px;margin-bottom:56px}
.section-head h2{font-size:clamp(28px,3.4vw,40px);margin-top:14px}
.section-head p{color:var(--ink-soft);font-size:16px;margin-top:14px}
.section-head.center{margin-left:auto;margin-right:auto;text-align:center}

/* ============================================================
   FEATURES — ticket-stub cards
   ============================================================ */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){ .features-grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .features-grid{grid-template-columns:1fr} }

.feature-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:28px 26px 26px;position:relative;overflow:hidden;
  transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
}
.feature-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift);border-color:var(--line-strong)}
.feature-card .f-icon{
  width:46px;height:46px;border-radius:12px;background:var(--brand-tint);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--brand-deep);
}
.feature-card .f-num{
  position:absolute;top:22px;right:22px;font-family:var(--mono);
  font-size:11px;color:var(--line-strong);font-weight:600;
}
.feature-card h3{font-size:19px;margin-bottom:9px}
.feature-card p{font-size:14.5px;color:var(--ink-soft)}

/* ============================================================
   STEPS — how it works (real sequence)
   ============================================================ */
.steps-list{display:flex;flex-direction:column}
.step-row{
  display:grid;grid-template-columns:90px 1fr;gap:28px;
  padding:30px 0;border-top:1px solid var(--line);
  align-items:start;
}
.step-row:last-child{border-bottom:1px solid var(--line)}
.step-num{font-family:var(--mono);font-size:14px;color:var(--brass);font-weight:600;padding-top:4px}
.step-body h3{font-size:21px;margin-bottom:8px}
.step-body p{color:var(--ink-soft);font-size:15px;max-width:560px}

/* ============================================================
   PRODUCT SHOWCASE
   ============================================================ */
.showcase-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:760px){ .showcase-grid{grid-template-columns:1fr} }
.shot{
  border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--line);
  background:var(--card);box-shadow:var(--shadow-soft);
}
.shot .shot-frame{
  aspect-ratio:16/10;background:
    repeating-linear-gradient(135deg, var(--paper-dim), var(--paper-dim) 10px, var(--card) 10px, var(--card) 20px);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  color:var(--ink-soft);font-size:12.5px;
}
.shot img{width:100%;height:100%;object-fit:cover;aspect-ratio:16/10}
.shot .shot-caption{padding:16px 18px;font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line)}
.shot .shot-caption b{color:var(--ink);font-weight:700}
.shot.wide{grid-column:1/-1}

/* ============================================================
   TESTIMONIALS
   ============================================================ */
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){ .testi-grid{grid-template-columns:1fr} }
.testi-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:28px 26px;position:relative;
}
.testi-card::before{
  content:'';position:absolute;top:0;left:26px;width:36px;height:36px;
  background:var(--paper);border:1.5px dashed var(--line-strong);border-radius:50%;
  transform:translateY(-50%);
}
.testi-quote{font-family:var(--display);font-size:17px;line-height:1.5;color:var(--ink);margin-top:8px}
.testi-foot{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line-strong)}
.testi-avatar{
  width:42px;height:42px;border-radius:50%;background:var(--sage);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:600;font-size:13px;color:var(--brand-deep);flex-shrink:0;
}
.testi-name{font-size:14px;font-weight:700}
.testi-role{font-size:12.5px;color:var(--ink-soft)}

/* ============================================================
   PRICING
   ============================================================ */
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
@media (max-width:980px){ .plans-grid{grid-template-columns:1fr;max-width:420px;margin:0 auto} }
.plan-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:34px 30px;display:flex;flex-direction:column;position:relative;
}
.plan-card.featured{
  border-color:var(--brand);box-shadow:var(--shadow-lift);
  background:linear-gradient(180deg, var(--brand-tint), var(--card) 40%);
}
.plan-tag{
  position:absolute;top:-13px;left:30px;background:var(--brass);color:#221704;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:5px 14px;border-radius:100px;text-transform:uppercase;
}
.plan-name{font-family:var(--display);font-size:22px;font-weight:600}
.plan-desc{font-size:13.5px;color:var(--ink-soft);margin-top:6px;min-height:36px}
.plan-price{display:flex;align-items:baseline;gap:6px;margin:22px 0 6px}
.plan-price .amount{font-family:var(--display);font-size:40px;font-weight:600}
.plan-price .period{font-size:13px;color:var(--ink-soft)}
.plan-list{list-style:none;padding:0;margin:24px 0 28px;display:flex;flex-direction:column;gap:12px;flex:1}
.plan-list li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.plan-list li svg{flex-shrink:0;margin-top:2px;color:var(--brand)}
.plan-card .btn{width:100%}

/* ============================================================
   ABOUT / INSTITUCIONAL
   ============================================================ */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;align-items:center}
@media (max-width:900px){ .about-grid{grid-template-columns:1fr;gap:40px} }
.about-visual{
  aspect-ratio:4/5;border-radius:var(--radius-lg);
  background:linear-gradient(155deg, var(--brand-deep), var(--brand));
  display:flex;align-items:center;justify-content:center;padding:32px;
  position:relative;overflow:hidden;
}
.about-visual img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-lg)}
.about-visual .placeholder-copy{color:rgba(255,255,255,.72);text-align:center;font-size:13px;font-family:var(--mono)}
.about-body p{color:var(--ink-soft);font-size:15.5px;margin-top:16px}
.institutional-box{
  margin-top:30px;padding:22px 24px;border:1px solid var(--line);border-radius:var(--radius-md);
  background:var(--card);display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;
}
@media (max-width:520px){ .institutional-box{grid-template-columns:1fr} }
.institutional-box dt{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-deep);font-weight:600;margin-bottom:3px}
.institutional-box dd{margin:0;font-size:14px;color:var(--ink)}

/* ============================================================
   FINAL CTA
   ============================================================ */
.final-cta{
  background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);
  padding:64px 56px;text-align:center;position:relative;overflow:hidden;
  margin:0 28px;
}
@media (max-width:640px){ .final-cta{padding:48px 26px;margin:0 20px} }
.final-cta::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(246,247,243,.14) 1.6px, transparent 1.6px);
  background-size:22px 22px;opacity:.5;
}
.final-cta-inner{position:relative;max-width:600px;margin:0 auto}
.final-cta h2{font-size:clamp(28px,3.6vw,42px);color:#fff}
.final-cta p{color:rgba(246,247,243,.72);font-size:16px;margin:16px 0 32px}
.final-cta .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ============================================================
   FOOTER
   ============================================================ */
footer.site-footer{background:var(--brand-deep);color:rgba(246,247,243,.82);padding:64px 0 28px;margin-top:96px}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;padding-bottom:44px;border-bottom:1px solid rgba(246,247,243,.14)}
@media (max-width:820px){ .footer-grid{grid-template-columns:1fr 1fr;row-gap:36px} }
@media (max-width:520px){ .footer-grid{grid-template-columns:1fr} }
.footer-brand .brand-badge{background:rgba(246,247,243,.14);color:#fff}
.footer-brand .brand-text b{color:#fff}
.footer-brand .brand-text span{color:rgba(246,247,243,.55)}
.footer-brand p{margin-top:16px;font-size:13.5px;color:rgba(246,247,243,.6);max-width:280px}
.footer-col h4{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(246,247,243,.5);margin-bottom:16px;font-weight:600}
.footer-col a, .footer-col address{display:block;font-size:14px;margin-bottom:11px;color:rgba(246,247,243,.85);font-style:normal}
.footer-col a:hover{color:#fff}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;flex-wrap:wrap;gap:12px}
.footer-bottom p{font-size:12.5px;color:rgba(246,247,243,.5)}
.social-row{display:flex;gap:10px}
.social-row a{
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(246,247,243,.2);
  display:flex;align-items:center;justify-content:center;transition:background .2s, border-color .2s;
}
.social-row a:hover{background:rgba(246,247,243,.1);border-color:rgba(246,247,243,.4)}

/* ============================================================
   REVEAL ANIMATION
   ============================================================ */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease}
.reveal.in{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<header class="site-nav">
  <div class="wrap nav-inner">

function renderNavBrand(targetId, dark){
  const el = $(targetId);
  el.innerHTML = `
    <div class="brand-badge">${SITE.empresa.nome.charAt(0)}</div>
    <div class="brand-text">
      <b>${SITE.empresa.nome}</b>

function renderHero(){
  $('heroEyebrow').textContent = SITE.hero.eyebrow;
  $('heroTitle').innerHTML = `${SITE.hero.tituloParte1} <em>${SITE.hero.tituloDestaque}</em> ${SITE.hero.tituloParte2}`;
  $('heroLead').textContent = SITE.hero.texto;
  $('heroCtaPrimary').textContent = SITE.hero.ctaPrimario;
  $('heroCtaSecondary').textContent = SITE.hero.ctaSecundario;
  $('heroNoteText').textContent = SITE.hero.notaTexto;
  $('heroAvatars').innerHTML = SITE.hero.avatares.map(a => `<span>${a}</span>`).join('');

  const stage = $('ticketStage');
  stage.innerHTML = SITE.hero.tickets.map((t,i) => `
    <div class="ticket ticket-${i+1}">
      <span class="t-num">${t.numero}</span>
      <div class="t-cliente">${t.cliente}</div>
      <div class="t-servico">${t.servico}</div>
      <span class="t-status ${t.classe}">${t.status}</span>
    </div>
  `).join('');
}

function renderStats(){
  $('statsRow').innerHTML = SITE.stats.map(s => `
    <div class="stat-stub">
      <span class="s-num">${s.numero}</span>
      <div class="s-val">${s.valor}</div>
      <div class="s-label">${s.legenda}</div>
    </div>
  `).join('');
}

    <div class="feature-card">
      <span class="f-num">0${i+1}</span>
      <div class="f-icon">${iconMap[f.titulo] || ''}</div>
      <h3>${f.titulo}</h3>
      <p>${f.texto}</p>

  `).join('');
}

    <div class="shot ${s.larga ? 'wide' : ''}">
      ${s.src

        : `<div class="shot-frame">Substitua por uma captura de tela do sistema<br>(campo "src" em SITE.screenshots)</div>`

function initials(nome){
  return nome.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
}

}

/* ── mobile menu ── */
const menuToggle = document.getElementById('menuToggle');
const navLinks = document.getElementById('navLinks');
menuToggle.addEventListener('click', () => {
  const open = navLinks.classList.toggle('open');
  menuToggle.classList.toggle('open', open);
  menuToggle.setAttribute('aria-expanded', open);
});
navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
  navLinks.classList.remove('open');
  menuToggle.classList.remove('open');
  menuToggle.setAttribute('aria-expanded', false);
}));

/* ── scroll reveal ── */
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!prefersReduced && 'IntersectionObserver' in window){
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold:.14, rootMargin:'0px 0px -60px 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
} else {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
}

/* ── hero ticket parallax (desktop, pointer devices only) ── */
if(!prefersReduced && window.matchMedia('(hover:hover) and (min-width:981px)').matches){
  const stage = document.getElementById('ticketStage');
  const baseTransforms = ['rotate(-9deg)','rotate(4deg)','rotate(-3deg)','rotate(12deg)'];
  stage.addEventListener('mousemove', (e) => {
    const r = stage.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5;
    const py = (e.clientY - r.top) / r.height - .5;
    const tickets = stage.querySelectorAll('.ticket');
    tickets.forEach((t, i) => {
      const depth = (i+1) * 4;
      t.style.transform = `${baseTransforms[i]} translate(${px*depth}px, ${py*depth}px)`;
    });
  });
  stage.addEventListener('mouseleave', () => {
    stage.querySelectorAll('.ticket').forEach((t,i) => { t.style.transform = baseTransforms[i]; });
  });
}
</script>
